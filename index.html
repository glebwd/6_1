<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сложный пример CSS Grid</title>
<style>
 body {
 display: flex;
 align-items: center;
 justify-content: center;
 min-height: 100vh;
 margin: 0;
 font-family: Arial, sans-serif;
 background-color: #f5f5f5;
 }
 /* Контейнер сетки */
 .grid-container {
 display: grid;
 grid-template-columns: repeat(5, 1fr);
 grid-template-rows: 120px 120px 200px 50px;
 grid-template-areas: 
 "wide wide allwide allwide ."
 "und und und und ."
 "big . . . ."
 ". . . . footer";
 width: 90%;
 max-width: 1200px;
 gap: 10px;
 }
 /* Цветные элементы сетки с именованными областями */
 .item4 { grid-area: footer; background-color: #4D96FF; }
 .item5 { grid-area: big; background-color: #FFB6B9; }
 .item6 { grid-area: wide; background-color: #A1E8AF; }
 .item7 { grid-area: allwide; background-color: #FFE156; }
 .item8 { grid-area: und; background-color: #FF9F1C; }

 /* Оформление элементов сетки */
 .grid-item {
 display: flex;
 align-items: center;
 justify-content: center;
 color: white;
 font-size: 1.5em;
 font-weight: bold;
 border-radius: 8px;
 padding: 20px;
 }

</style>
</head>
<body>
<div class="grid-container">
 <div class="grid-item item4">Футер</div>
 <div class="grid-item item5">Большой блок</div>
 <div class="grid-item item6">Широкий блок</div>
 <div class="grid-item item7">Во всю ширину</div>
 <div class="grid-item item8">Нижний блок</div>
</div>
</body>
</html>
